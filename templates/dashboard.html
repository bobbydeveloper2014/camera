<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="my-4">Dashboard</h1>

        <p><strong>ID Người Dùng:</strong> {{ session['user_id'] }}</p>

        <div class="mb-4">
            <a href="/add_device" class="btn btn-success">Thêm thiết bị</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Đăng xuất</a>
        </div>

        <h3>Danh sách thiết bị</h3>
        <ul class="list-group">
            {% for device in devices %}
                <li class="list-group-item">
                    <h5>{{ device.device_id }}</h5>
                    <button class="btn btn-info start-stream" data-device-id="{{ device.device_id }}">
                        Xem camera
                    </button>
                </li>
            {% endfor %}
        </ul>

        <div id="stream-container" class="my-4" style="display:none;">
            <h4>Đang xem camera</h4>
            <img id="viewer-image" width="640" height="360" alt="Camera stream sẽ hiển thị ở đây">
        </div>

        <div id="camera-container" class="my-4" style="display:none;">
            <h4>Camera đang phát trực tiếp</h4>
            <video id="local-video" width="640" height="360" autoplay muted playsinline></video>
        </div>
    </div>

<script>
const socket = io(window.location.origin, { transports: ['websocket'] });
const userId = {{ session['user_id'] }};
const localVideo = document.getElementById('local-video');
const cameraContainer = document.getElementById('camera-container');
const streamContainer = document.getElementById('stream-container');
const viewerImage = document.getElementById('viewer-image');
let localStream = null;
let isCamera = false;
let frameUrl = null;

socket.on('connect', () => {
    console.log('✅ Socket connected:', socket.id);
});

// Viewer nhấn "Xem camera"
document.querySelectorAll('.start-stream').forEach(button => {
    button.addEventListener('click', () => {
        const deviceId = button.getAttribute('data-device-id');
        console.log('📺 Viewer yêu cầu xem thiết bị:', deviceId);
        socket.emit('notify_view_camera', { device_id: deviceId, viewer_id: String(userId) });
        streamContainer.style.display = 'block';
    });
});

// Server bảo camera bắt đầu phát
socket.on('register_camera_command', data => {
    console.log('📹 Server yêu cầu camera phát:', data);
    cameraContainer.style.display = 'block';
    startCamera(String(data.device_id), String(data.viewer_id));
});

// Viewer nhận frame từ server
socket.on('frame_to_viewer', data => {
    if (!data || !data.frame) return;

    const buffer = data.frame;
    if (!(buffer instanceof ArrayBuffer)) {
        console.warn('⚠️ Frame không phải ArrayBuffer:', buffer);
        return;
    }

    console.log('🎥 Nhận frame, kích thước:', buffer.byteLength);
    const blob = new Blob([buffer], { type: 'image/jpeg' });
    if (frameUrl) URL.revokeObjectURL(frameUrl);
    frameUrl = URL.createObjectURL(blob);
    viewerImage.src = frameUrl;
});

// Hàm bật camera và gửi frame
function startCamera(deviceId, viewerId) {
    if (isCamera) return;
    isCamera = true;

    socket.emit('register_device', { device_id: deviceId });
    console.log('📡 Camera đăng ký device:', deviceId);

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
            localStream = stream;
            localVideo.srcObject = stream;
            cameraContainer.style.display = 'block';

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 640;
            canvas.height = 360;

            function sendFrame() {
                if (!localStream.active) return;
                ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => {
                    if (!blob) return;
                    blob.arrayBuffer().then(buf => {
                        socket.emit('frame_binary', {
                            frame: buf,
                            device_id: deviceId,
                            sender_id: String(userId),
                            target_id: String(viewerId)
                        });
                    });
                }, 'image/jpeg', 0.6);
            }

            const interval = setInterval(sendFrame, 100);
            localStream.getTracks().forEach(track => {
                track.addEventListener('ended', () => {
                    clearInterval(interval);
                    isCamera = false;
                });
            });
        })
        .catch(err => console.error('❌ Lỗi truy cập camera:', err));
}
</script>
</body>
</html>
